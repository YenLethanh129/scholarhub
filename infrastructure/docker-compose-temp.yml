version: '3.8'

services:
  # 1. PostgreSQL (User, Role, Folder Structure)
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: your_user
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: multimedia_db
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - network

  # 2. MongoDB (Metadata - Technical Info)
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: your_user
      MONGO_INITDB_ROOT_PASSWORD: your_password
    volumes:
      - ./data/mongodb:/data/db
    ports:
      - "27017:27017"
    networks:
      - network

  # 3. MinIO (Object Storage - Files)
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: your_user
      MINIO_ROOT_PASSWORD: your_password
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data  --console-address ":9001"
    networks:
      - network

  # 4. Redis (Caching Layer)
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - network

  createbuckets:
    image: minio/mc
    container_name: minio-setup
    depends_on:
      - minio
    networks:
      - network
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo 'Waiting for MinIO to be ready...'
        # Thử kết nối cho đến khi thành công (exit code 0)
        until mc alias set myminio http://minio:9000 user password; do
          echo '... MinIO is initializing ...'
          sleep 1
        done
        
        echo 'MinIO is UP! Creating bucket...'
        mc mb myminio/learning-materials --ignore-existing
        
        echo 'Setting policy public...'
        mc anonymous set download myminio/learning-materials
        
        echo 'MinIO Setup Complete!'
        exit 0

networks:
  network:
    driver: bridge