spring.application.name=scholarhub
# ==============================================================
# 1. SERVER CONFIGURATION
# ==============================================================
server.port=${SERVER_PORT}
# Prefix cho toàn bộ API (Best Practice: versioning)
server.servlet.context-path=${API_PATH}

# ==============================================================
# 2. FILE UPLOAD LIMITS (CRITICAL FOR MULTIMEDIA)
# ==============================================================
# Cho phép upload file lớn (500MB - Tùy chỉnh theo nhu cầu)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE}
spring.servlet.multipart.max-request-size=${FILE_MAX_SIZE}

# ==============================================================
# 3. POSTGRESQL CONFIGURATION (User, Folder Structure)
# ==============================================================
spring.datasource.url=${POSTGRESQL_URL}
spring.datasource.username=${POSTGRESQL_USERNAME}
spring.datasource.password=${POSTGRESQL_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# 4. MONGODB CONFIGURATION (Metadata)
# ==============================================================
# Format: mongodb://user:pass@host:port/db_name?authSource=admin
spring.data.mongodb.uri=${MONGODB_URL}
spring.data.mongodb.auto-index-creation=true

# ==============================================================
# 5. REDIS CONFIGURATION (Caching)
# ==============================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
# Timeout kết nối (ms)
spring.data.redis.timeout=${REDIS_TIMEOUT}

# ==============================================================
# 8. ELASTICSEARCH CONFIGURATION (Search Engine)
# ==============================================================
spring.elasticsearch.uris=${ELASTICSEARCH_URL}

# ==============================================================
# 6. MINIO CONFIGURATION (Custom Properties)
# ==============================================================
# Lưu ý: Phải có http:// đằng trước
minio.url=${MINIO_URL}
minio.access-key=${MINIO_USER}
minio.secret-key=${MINIO_PASSWORD}
minio.bucket-name=${MINIO_BUCKET_NAME}

# ==============================================================
# 7. SECURITY & JWT CONFIGURATION
# ==============================================================
# Secret key này dùng để ký Token (HS256).
# IMPORTANT: Chuỗi này phải đủ dài (ít nhất 32 ký tự) và bảo mật.
# Trong môi trường Prod, nên để trong Biến môi trường (Environment Variable).
jwt.secret=${JWT_SECRET}
# Thời gian hết hạn Token (ms): 86400000 = 1 ngày
jwt.expiration=${JWT_EXPIRATION}

# Ép Spring Security in ra chi tiết từng bước kiểm tra
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=TRACE

gotenberg.url=${GOTENBERG_URL}

app.domain=${APP_DOMAIN}